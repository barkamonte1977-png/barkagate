[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "barkagate"
version = "0.1.0"
description = "Check whether AI crawlers (ChatGPT, Claude, Perplexity, Google, Apple...) can reach your site."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Barkamonte" }]
dependencies = []

[project.urls]
Homepage = "https://barkamonte.com"
Source = "https://github.com/barkamonte1977-png/barkagate"

[project.scripts]
barkagate = "barkagate.cli:main"

[tool.setuptools]
packages = ["barkagate"]
